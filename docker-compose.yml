services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=false
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - RATE_LIMIT_ENABLED=true
    volumes:
      - ./backend/storage:/app/storage
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf_cache:
